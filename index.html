<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Tabuada</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h2 id="calcular">Calculadora</h2>
        <div id="visor-conteiner">
            <div id="previsao_de_operaçao"></div>
            <div id="atualOperaçao"></div>

        </div>
        <div id="basico">
            <button>CE</button>
            <button>C</button>
            <button>DEL</button>
            <button>/</button>
            <button class="Number">7</button>
            <button class="Number">8</button>
            <button class="Number">9</button>
            <button>*</button>
            <button class="Number">4</button>
            <button class="Number">5</button>
            <button class="Number">6</button>
            <button>-</button>
            <button class="Number">1</button>
            <button class="Number">2</button>
            <button class="Number">3</button>
            <button>+</button>
            <button class="Number">0</button>
            <button class="Number">.</button>
            <button id="igual">=</button>
            
        </div>

        <div id="cientifica">
            <button class="btn-cientifica" data-action="Rad">Rad</button>
            <button class="btn-cientifica" data-action="Deg">Deg</button>
            <button class="btn-cientifica" data-action="%">%</button>
            <button class="btn-cientifica" data-action="x!">x!</button>
            <button class="btn-cientifica" data-action="log">log</button>
            <button class="btn-cientifica" data-action="sin">sin</button>
            <button class="btn-cientifica" data-action="cos">cos</button>
            <button class="btn-cientifica" data-action="tan">tan</button>
            <button class="btn-cientifica" data-action="ln">ln</button>
            <button class="btn-cientifica" data-action="x2">x<sup>2</sup></button>
            <button class="btn-cientifica" data-action="xn">x<sup>n</sup></button>
            <button class="btn-cientifica" data-action="raiz_quadrada">√</button>
            <button class="btn-cientifica" data-action="ex">e<sup>x</sup></button>
            <button class="btn-cientifica" data-action="pi">π</button>
            <button class="btn-cientifica" data-action="e">e</button>
            <button class="btn-cientifica" data-action="(">(</button>
            <button class="btn-cientifica" data-action=")">)</button>
        </div>
        
    </main>
</body>
</html>
